[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "controldone"
version = "2.0.0"
description = "ControlDOne v2 — contrôle de cohérence des documents d'import (facture, déclaration, facture transitaire, avoirs)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "python-multipart",
    "uvicorn[standard]",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "jsonschema",
    "pyyaml>=6.0",
  "jinja2>=3.1",
  "fastapi>=0.110",
  "sqlalchemy>=2.0",
  "cryptography>=42.0",
  "argon2-cffi>=23.1",
  "itsdangerous>=2.1",
  "pdfplumber>=0.11",
  "pypdf>=4.0",
  "pypdfium2>=4.0",
  "pytesseract>=0.3.10",
  "pillow>=10.0",
  "reportlab>=4.0",
  "lxml>=5.0",
  "factur-x>=3.0",
  "openpyxl>=3.1",
  "anthropic>=0.80",
  "mcp>=1.0",
  "stripe>=8.0",
  # importé directement (F-17) : veille réseau (agents/veille_sources.py). numpy n'est plus utilisé : le
  # redressement OCR (ingest/pages.py) est en PIL seul, angles identiques (D-1404).
  "httpx>=0.27",
]

[project.scripts]
controldone = "controldone.cli:main"

[project.optional-dependencies]
# Outils de développement seulement (jamais dans l'image) ; licences : pytest MIT, ruff MIT, pytest-cov MIT, coverage
# Apache-2.0, hypothesis MPL-2.0 (copyleft faible au fichier, non distribué), pre-commit MIT (D-3901–D-3903).
dev = ["pytest>=8.0", "ruff>=0.4", "pytest-cov>=5.0", "coverage[toml]>=7.4", "hypothesis>=6.100", "pre-commit>=3.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/controldone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
  "lent: test long (exercice de restauration de bout en bout) ; exclure avec -m 'not lent'",
  "proprietes: test de propriétés Hypothesis (tests/proprietes, profil HYPOTHESIS_PROFILE)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "RUF001",  # caractères Unicode ambigus : textes français (espaces fines, ’)
  "RUF002",
  "RUF003",
  "E501",
  "SIM905",  # listes de codes écrites en chaîne puis découpées (lisibilité)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# Couverture des tests (D-3902) : `make couverture` (pytest-cov) ; HTML dans var/couverture/html, résumé par paquet
# dans var/couverture/paquets.md (scripts/couverture_paquets.py). Base de référence : docs/QUALITE.md.
[tool.coverage.run]
source = ["controldone"]
branch = true
data_file = "var/couverture/.coverage"
omit = ["*/controldone/web/static/*"]

[tool.coverage.report]
skip_empty = true
precision = 1
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.coverage.html]
directory = "var/couverture/html"

[tool.coverage.json]
output = "var/couverture/couverture.json"
