[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "controldone"
version = "2.0.0"
description = "ControlDOne v2 — contrôle de cohérence des documents d'import (facture, déclaration, facture transitaire, avoirs)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "python-multipart",
    "uvicorn[standard]",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "jsonschema",
    "pyyaml>=6.0",
  "jinja2>=3.1",
  "fastapi>=0.110",
  "sqlalchemy>=2.0",
  "cryptography>=42.0",
  "argon2-cffi>=23.1",
  "itsdangerous>=2.1",
  "pdfplumber>=0.11",
  "pypdf>=4.0",
  "pypdfium2>=4.0",
  "pytesseract>=0.3.10",
  "pillow>=10.0",
  "reportlab>=4.0",
  "lxml>=5.0",
  "factur-x>=3.0",
  "openpyxl>=3.1",
  "anthropic>=0.80",
  "mcp>=1.0",
  "stripe>=8.0",
  # importés directement (F-17) : redressement OCR (ingest/pages.py), veille réseau (agents/veille_sources.py)
  "numpy>=1.26",
  "httpx>=0.27",
]

[project.scripts]
controldone = "controldone.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/controldone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "RUF001",  # caractères Unicode ambigus : textes français (espaces fines, ’)
  "RUF002",
  "RUF003",
  "E501",
  "SIM905",  # listes de codes écrites en chaîne puis découpées (lisibilité)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
