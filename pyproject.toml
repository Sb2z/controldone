[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "controldone"
version = "0.5.0"
description = "Documentary customs control for goods invoices, customs declarations and forwarder duty invoices."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.23,<2",
  "pytesseract>=0.3.10,<0.4",
  "pillow>=10,<12",
  "openpyxl>=3.1,<4",
  "tqdm>=4.65,<5",
  "pyyaml>=6,<7",
  "flask>=3,<4",
  "opencv-python-headless>=4.8,<5",
  "numpy>=1.24,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
controldone = "controldone.cli:main"
controldone-web = "controldone.webapp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
controldone = [
  "web/templates/*.html",
  "web/static/*.css",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
