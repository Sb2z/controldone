# Liste des transitaires publiés sous un alias public dans le référentiel anonymisé
# (docs/REFERENTIEL.md). Tenue par le fondateur. Un transitaire absent de cette liste est publié sous
# une empreinte salée (T-xxxxxxxxxxxx). Ne lister qu'un transitaire qui a donné son accord écrit (référence
# de l'accord à indiquer dans un commentaire de l'entrée). Le référentiel ne publie que des statistiques de
# prix, jamais de taux d'écart ou d'erreur attribués à un transitaire identifiable (brief juridique §5.4).
# Les entrées ci-dessous sont des exemples FICTIFS.
version: 1
alias: {}
# Champ obligatoire « accord_ecrit » (référence et date de l'accord) : sans lui, l'entrée est ignorée et le
# transitaire reste sous empreinte salée. Un transitaire nommé n'a que des statistiques de prix (aucun taux).
#  "Transitaire national FICTIF":
#    accord_ecrit: "accord-FICTIF-2026-01, 2026-10-01"
#    tva: ["FR00000000000"]
#    noms: ["TRANSITAIRE NATIONAL FICTIF SAS"]
