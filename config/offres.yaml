# Offres commerciales et paramètres de facturation de ControlDOne (fondateur).
# Lu par controldone.facturation.offres.charger_offres(). Montants en EUR HT, chaînes décimales exactes.
# Les valeurs marquées « valeur de départ » sont des hypothèses commerciales à ajuster par le fondateur.
version: 1

offres:
  diagnostic:
    libelle: "Diagnostic de cohérence documentaire (lot de dossiers passés)"
    type: forfait
    prix_ht: "390.00"
  commission:
    libelle: "Commission sur avoirs obtenus"
    type: commission
    # Fraction de la base §17.4 (crédits imputés sur des écarts issus de constats validés).
    taux: "0.20"
    # Champs descriptifs (CGV art. 5, brief juridique §6.1) — non lus par le code à ce jour.
    assiette: HT                 # montant hors taxes des avoirs émis par un transitaire
    exclusions:
      - "remboursements, remises ou dégrèvements accordés par une administration (douanière, fiscale ou autre)"
    facturation: mensuelle_recapitulative   # au titre des avoirs déclarés au cours du mois précédent
  continu:
    libelle: "Contrôle continu (abonnement mensuel)"
    type: abonnement
    # Paliers par nombre de dossiers contrôlés par mois. VALEURS DE DÉPART À AJUSTER (hypothèse commerciale,
    # non testée sur le marché) : prix et quotas seront revus après les premiers clients.
    paliers:
      - code: essentiel
        libelle: "Contrôle continu — Essentiel"
        prix_mensuel_ht: "99.00"
        dossiers_par_mois: 20
      - code: pro
        libelle: "Contrôle continu — Pro"
        prix_mensuel_ht: "199.00"
        dossiers_par_mois: 60
      - code: intensif
        libelle: "Contrôle continu — Intensif"
        prix_mensuel_ht: "349.00"
        dossiers_par_mois: 150

coupons:
  LANCEMENT-3-DIAGNOSTICS:
    libelle: "Remise de lancement (100 %) — accord de publication proposé séparément"
    offre: diagnostic
    remise_pourcentage: "100"
    utilisations_max: 3          # trois diagnostics au total, tous clients confondus
    une_fois_par_client: true
    # La remise ne dépend d'aucune contrepartie (brief juridique §4.4 : pas de troc). L'accord de publication
    # des résultats anonymisés est distinct, facultatif et révocable jusqu'à la publication.
    consentement_publication: optionnel   # cible (descriptif, non lu par le code)
    # Lu par le code. Cible : false (la remise s'applique sans accord de publication). Reste à true tant que
    # facturation/service.py (proposer_diagnostic) suppose un consentement présent : avec false et sans
    # consentement, il lève AttributeError. À basculer avec la correction du code et de ses tests.
    consentement_requis: true

tva:
  # Au démarrage : micro-entreprise en franchise en base (art. 293 B du CGI) -> tva_applicable: false ;
  # la mention ci-dessous est imprimée et la catégorie de TVA du XML est « E » au taux 0.
  # Passer à true (ou CONTROLDONE_TVA_APPLICABLE=true) dès le dépassement du seuil majoré.
  tva_applicable: false
  taux: "20.00"                # taux appliqué après sortie de la franchise
  mention_franchise: "TVA non applicable, art. 293 B du CGI"
  # Seuils de la franchise pour les prestations de services (2026, brief juridique §4.2) — descriptifs,
  # non lus par le code à ce jour : alerte à prévoir dès que les recettes de l'année atteignent le seuil majoré.
  seuil_franchise_eur: "37500.00"
  seuil_franchise_majore_eur: "41250.00"
  alerte_depassement_seuil: true
  # Client établi en Suisse (impôt sur les acquisitions chez le client) : mention À VALIDER par l'expert-comptable.
  mention_autoliquidation_ch: "À VALIDER : Autoliquidation — TVA due par le preneur"
  # Option pour le paiement de la TVA d'après les débits (prestations de services) : false par défaut
  # (TVA exigible à l'encaissement). Si true : mention imprimée et code BT-8 = 5 (date de facture).
  option_debits: false

numerotation:
  # Une série continue par entité légale, par préfixe et par année : F-2026-0001, AV-2026-0001.
  facture: "F"
  avoir: "AV"
  chiffres: 4

paiement:
  delai_jours: 30
  moyen: "Virement SEPA ou carte bancaire (lien de paiement sécurisé)"
  # L441-10 C. com. : au minimum le taux de refinancement de la BCE majoré de 10 points (ou 3 × taux légal).
  penalites: "Pénalités de retard exigibles dès le lendemain de la date d'échéance : taux de refinancement de la BCE en vigueur majoré de 10 points (art. L441-10 du Code de commerce)."
  indemnite: "Indemnité forfaitaire pour frais de recouvrement en cas de retard de paiement : 40 EUR (art. L441-10 et D441-5 du Code de commerce)."
  escompte: "Pas d'escompte pour paiement anticipé."

# Vendeur (le fondateur). Chaque valeur peut être remplacée par une variable d'environnement
# CONTROLDONE_VENDEUR_<CLE EN MAJUSCULES> (ex. CONTROLDONE_VENDEUR_SIREN). Tant qu'un champ vaut
# « À COMPLÉTER », la facture porte un bandeau « NON VALABLE » et l'émission est refusée en production.
vendeur:
  identifiant: "fondateur"            # entité légale : clé de la série de numérotation
  raison_sociale: "À COMPLÉTER"
  forme_juridique: "À COMPLÉTER"      # ex. « EI » (entrepreneur individuel, nom suivi de « EI »)
  siren: "À COMPLÉTER"
  rcs: "À COMPLÉTER"                  # micro-entreprise BNC : « Immatriculé au RNE » (pas de RCS)
  tva_intracom: "À COMPLÉTER"
  adresse_ligne: "À COMPLÉTER"
  code_postal: "À COMPLÉTER"
  ville: "À COMPLÉTER"
  pays: "FR"
  email: "À COMPLÉTER"
  iban: "À COMPLÉTER"
  bic: "À COMPLÉTER"
  # Adresse électronique de facturation (annuaire de la réforme, schéma 0225) : par défaut le SIREN.
  adresse_electronique: ""
