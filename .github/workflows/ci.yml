# ControlDOne v2 — intégration continue. Déclenchement MANUEL uniquement (workflow_dispatch) pour ne pas
# consommer les minutes GitHub Actions du fondateur sans son accord.
# Activer sur push / pull request : docs/DEPLOIEMENT.md § 12.
name: CI

on:
  workflow_dispatch:
    inputs:
      banc:
        description: "Générer le corpus et appliquer la porte du banc (holdout)"
        type: boolean
        default: true
      avec_llm:
        description: "Utiliser le secret ANTHROPIC_API_KEY pour le banc (coût IA réel)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  CONTROLDONE_ENV: test

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Tesseract (fra, eng, osd)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng tesseract-ocr-osd
          tesseract --list-langs

      - name: Dépendances (figées) + outils de dev
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .
          pip install "pytest>=8.0" "ruff>=0.4" "pytest-cov>=5.0" "coverage[toml]>=7.4" "hypothesis>=6.100" \
            "pre-commit>=3.5"

      - name: Ruff
        run: ruff check src tests scripts

      # D-3901 : mêmes vérifications qu'avant enregistrement (toutes locales, aucun dépôt de crochets téléchargé).
      - name: Vérifications avant enregistrement (pre-commit, tout le dépôt)
        run: pre-commit run --all-files --show-diff-on-failure

      # D-3203 : vulnérabilités connues (pip-audit sur requirements.lock), SBOM CycloneDX, licences permissives
      # seulement (exceptions justifiées : config/audit_dependances.json). Outils dans un environnement séparé.
      - name: Audit des dépendances (vulnérabilités, SBOM, licences)
        run: |
          python -m venv .venv-audit
          .venv-audit/bin/pip install --quiet "pip-audit>=2.7" "cyclonedx-bom>=4" "pip-licenses>=5"
          python scripts/audit_dependances.py --venv "$(python -c 'import sys; print(sys.prefix)')" \
            --outils .venv-audit --out var/audit

      - name: SBOM et rapport de licences
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: audit-dependances
          path: var/audit/
          if-no-files-found: ignore
          retention-days: 30

      # D-3903 : tests de propriétés à profil borné et déterministe (150 exemples par propriété, graine fixe).
      - name: Tests de propriétés (Hypothesis, profil ci)
        env:
          HYPOTHESIS_PROFILE: ci
        run: pytest -q tests/proprietes

      # D-3902 : suite complète sous mesure de couverture (branches) ; résumé par paquet et HTML en artefact.
      - name: Pytest avec couverture
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          mkdir -p var/couverture
          pytest -q --cov --cov-report=html --cov-report=json --cov-report=term:skip-covered
          python scripts/couverture_paquets.py var/couverture/couverture.json --out var/couverture/paquets.md \
            --min "${COUV_MIN:-0}"
          cat var/couverture/paquets.md >> "$GITHUB_STEP_SUMMARY"

      - name: Rapport de couverture
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: couverture
          path: |
            var/couverture/html/
            var/couverture/paquets.md
            var/couverture/couverture.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Banc — génération du corpus (dev + holdout)
        if: ${{ inputs.banc }}
        run: python -m bench.generator --split all --out bench/corpus --jobs 4

      - name: Banc — exécution sur le holdout
        if: ${{ inputs.banc }}
        env:
          ANTHROPIC_API_KEY: ${{ inputs.avec_llm && secrets.ANTHROPIC_API_KEY || '' }}
        run: python -m controldone.bench_run --corpus bench/corpus --split holdout --out bench/out/ci --workers 4 --no-score

      - name: Banc — porte (seuil bloquant SPEC §19.7)
        if: ${{ inputs.banc }}
        run: python -m bench.score --corpus bench/corpus --split holdout --run bench/out/ci --gate

      - name: Métriques du banc
        if: ${{ always() && inputs.banc }}
        uses: actions/upload-artifact@v4
        with:
          name: bench-holdout-metrics
          path: |
            bench/out/ci/metrics.json
            bench/out/ci/*.md
          if-no-files-found: ignore
          retention-days: 14
