# ControlDOne v2 — production sur une VM (un seul hôte). Voir docs/DEPLOIEMENT.md.
#
#   cd /srv/controldone/app/deploy
#   cp .env.prod.example .env.prod && chmod 600 .env.prod   # puis compléter (jamais commité)
#   ln -s .env.prod .env                                     # interpolation (domaine, chemins) par compose
#   docker compose up -d --build
#
# Services : web (uvicorn, derrière caddy), worker (file de tâches), scheduler (relevés, agents, purge,
# sauvegardes), caddy (HTTPS automatique). Seul caddy publie des ports (80, 443).
# Données : CONTROLDONE_HOST_VAR (base SQLite + coffre chiffré) et CONTROLDONE_HOST_BACKUPS (archives
# chiffrées), sur le volume chiffré monté en /srv/controldone.

name: controldone

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: controldone:${CONTROLDONE_VERSION:-2.0.0}
  env_file:
    - .env.prod
  restart: unless-stopped
  read_only: true
  # /tmp reste un petit tmpfs : téléversements, lots déchiffrés et sauvegardes passent par
  # CONTROLDONE_TMP_DIR (/app/var/tmp, sur le volume de données — D-1305).
  tmpfs:
    - /tmp:size=256m,mode=1777
  environment:
    CONTROLDONE_TMP_DIR: /app/var/tmp
    TMPDIR: /app/var/tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  volumes:
    - ${CONTROLDONE_HOST_VAR:-/srv/controldone/var}:/app/var
  networks:
    - interne
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  web:
    <<: *app
    command: ["controldone", "serve", "--host", "0.0.0.0", "--port", "8000",
              "--sans-worker", "--proxy", "--https", "--init-schema",
              "--forwarded-allow-ips", "172.30.57.10"]
    expose:
      - "8000"
    # Healthcheck hérité de l'image (GET /sante).
    stop_grace_period: 30s

  worker:
    <<: *app
    command: ["python", "-m", "controldone.jobs.worker"]
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy   # le schéma est créé par web (--init-schema)
    # Plus long que la durée d'un lot : arrêt propre (SIGTERM) sans job interrompu.
    stop_grace_period: 300s

  scheduler:
    <<: *app
    command: ["/app/deploy/scheduler.sh"]
    environment:
      CONTROLDONE_TMP_DIR: /app/var/tmp   # (la fusion YAML remplace le bloc « environment » commun)
      TMPDIR: /app/var/tmp
      BACKUP_DIR: /backups
      SCHED_BACKUP_HHMM: "${SCHED_BACKUP_HHMM:-0215}"
    volumes:
      - ${CONTROLDONE_HOST_VAR:-/srv/controldone/var}:/app/var
      - ${CONTROLDONE_HOST_BACKUPS:-/srv/controldone/backups}:/backups
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy
    stop_grace_period: 60s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CONTROLDONE_DOMAIN: ${CONTROLDONE_DOMAIN:?définir CONTROLDONE_DOMAIN dans deploy/.env.prod (lien .env)}
      ACME_EMAIL: ${ACME_EMAIL:?définir ACME_EMAIL dans deploy/.env.prod (lien .env)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CONTROLDONE_HOST_CADDY:-/srv/controldone/caddy}/data:/data
      - ${CONTROLDONE_HOST_CADDY:-/srv/controldone/caddy}/config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      web:
        condition: service_healthy
    networks:
      interne:
        ipv4_address: 172.30.57.10   # seule adresse dont web croit les en-têtes X-Forwarded-*
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  interne:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.57.0/24
